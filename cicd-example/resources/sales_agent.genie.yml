# The Genie Agent, defined as code.
# - Table names use ${var.catalog} and ${var.schema}, so the same definition deploys to dev, staging and prod.
# - The benchmarks at the end deploy with the agent; the benchmark gate runs them after every deployment.
# - Every list item needs an id: 32 lowercase hex characters, unique, lists sorted by id. Numbering by hand
#   with a letter per kind (a = sample question, b = benchmark, c = instruction, d = example SQL) does that.
# - Joins come from the primary and foreign keys on the tables; column descriptions from their comments.
resources:
  genie_spaces:
    sales_agent:
      title: Sales Analytics
      description: >-
        Revenue, orders, average order value and customers by region, country, market segment and order
        priority. For sales managers and analysts. Does not cover costs, margins or forecasts.
      warehouse_id: ${var.warehouse_id}
      permissions:
        - level: CAN_RUN
          group_name: ${var.agent_users_group}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "a0000000000000000000000000000001"
              question: ["What was total revenue in 2025?"]
            - id: "a0000000000000000000000000000002"
              question: ["Which region had the highest revenue in 2025?"]
            - id: "a0000000000000000000000000000003"
              question: ["Who are our top 10 customers by revenue?"]
            - id: "a0000000000000000000000000000004"
              question: ["Show monthly revenue for 2025."]
            - id: "a0000000000000000000000000000005"
              question: ["How many open orders do we have?"]
            - id: "a0000000000000000000000000000006"
              question: ["What is the average order value by market segment?"]
        data_sources:
          tables:
            - identifier: ${var.catalog}.${var.schema}.customers
              column_configs:
                - {column_name: country, enable_entity_matching: true}
                - {column_name: market_segment, enable_entity_matching: true}
                - {column_name: region, enable_entity_matching: true}
            - identifier: ${var.catalog}.${var.schema}.orders
              column_configs:
                - {column_name: order_priority, enable_entity_matching: true}
                - {column_name: order_status, enable_entity_matching: true}
        instructions:
          text_instructions:
            - id: "c0000000000000000000000000000001"
              content:
                - |
                  Revenue means SUM(orders.order_amount); average order value means AVG(orders.order_amount).
                  When no year is given, use 2025, the latest full year, and say so.
                  Costs, margins and forecasts are out of scope: say so instead of guessing.
          example_question_sqls:
            - id: "d0000000000000000000000000000001"
              question: ["What was revenue by region in 2024?"]
              sql: ["SELECT c.region, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2024 GROUP BY c.region ORDER BY revenue DESC"]
            - id: "d0000000000000000000000000000002"
              question: ["Who are the top customers by revenue?"]
              sql: ["SELECT c.customer_name, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id GROUP BY c.customer_name ORDER BY revenue DESC LIMIT 10"]
        benchmarks:
          questions:
            - id: "b0000000000000000000000000000001"
              question: ["What was total revenue in 2025?"]
              answer: [{format: SQL, content: ["SELECT SUM(order_amount) AS total_revenue FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2025"]}]
            - id: "b0000000000000000000000000000002"
              question: ["How much did we sell in 2025 in total?"]
              answer: [{format: SQL, content: ["SELECT SUM(order_amount) AS total_revenue FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2025"]}]
            - id: "b0000000000000000000000000000003"
              question: ["How many orders were placed in 2024?"]
              answer: [{format: SQL, content: ["SELECT COUNT(*) AS order_count FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2024"]}]
            - id: "b0000000000000000000000000000004"
              question: ["What was the order count for 2024?"]
              answer: [{format: SQL, content: ["SELECT COUNT(*) AS order_count FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2024"]}]
            - id: "b0000000000000000000000000000005"
              question: ["What was revenue by region in 2025?"]
              answer: [{format: SQL, content: ["SELECT c.region, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2025 GROUP BY c.region ORDER BY revenue DESC"]}]
            - id: "b0000000000000000000000000000006"
              question: ["Break down 2025 revenue by region."]
              answer: [{format: SQL, content: ["SELECT c.region, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2025 GROUP BY c.region ORDER BY revenue DESC"]}]
            - id: "b0000000000000000000000000000007"
              question: ["Who were the top 5 customers by revenue in 2025?"]
              answer: [{format: SQL, content: ["SELECT c.customer_name, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2025 GROUP BY c.customer_name ORDER BY revenue DESC LIMIT 5"]}]
            - id: "b0000000000000000000000000000008"
              question: ["List the five biggest customers by 2025 revenue."]
              answer: [{format: SQL, content: ["SELECT c.customer_name, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2025 GROUP BY c.customer_name ORDER BY revenue DESC LIMIT 5"]}]
            - id: "b0000000000000000000000000000009"
              question: ["Show monthly revenue for 2025."]
              answer: [{format: SQL, content: ["SELECT DATE_TRUNC('MONTH', order_date) AS month, SUM(order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2025 GROUP BY 1 ORDER BY 1"]}]
            - id: "b0000000000000000000000000000010"
              question: ["What was revenue per month in 2025?"]
              answer: [{format: SQL, content: ["SELECT DATE_TRUNC('MONTH', order_date) AS month, SUM(order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2025 GROUP BY 1 ORDER BY 1"]}]
            - id: "b0000000000000000000000000000011"
              question: ["What was the average order value by market segment in 2025?"]
              answer: [{format: SQL, content: ["SELECT c.market_segment, AVG(o.order_amount) AS average_order_value FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2025 GROUP BY c.market_segment ORDER BY average_order_value DESC"]}]
            - id: "b0000000000000000000000000000012"
              question: ["Average 2025 order size per market segment?"]
              answer: [{format: SQL, content: ["SELECT c.market_segment, AVG(o.order_amount) AS average_order_value FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2025 GROUP BY c.market_segment ORDER BY average_order_value DESC"]}]
            - id: "b0000000000000000000000000000013"
              question: ["How many open orders are there?"]
              answer: [{format: SQL, content: ["SELECT COUNT(*) AS open_orders FROM ${var.catalog}.${var.schema}.orders WHERE order_status = 'Open'"]}]
            - id: "b0000000000000000000000000000014"
              question: ["What is the number of orders that are still open?"]
              answer: [{format: SQL, content: ["SELECT COUNT(*) AS open_orders FROM ${var.catalog}.${var.schema}.orders WHERE order_status = 'Open'"]}]
            - id: "b0000000000000000000000000000015"
              question: ["Which country had the highest revenue in 2024?"]
              answer: [{format: SQL, content: ["SELECT c.country, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2024 GROUP BY c.country ORDER BY revenue DESC LIMIT 1"]}]
            - id: "b0000000000000000000000000000016"
              question: ["Top country by revenue in 2024?"]
              answer: [{format: SQL, content: ["SELECT c.country, SUM(o.order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders o JOIN ${var.catalog}.${var.schema}.customers c ON o.customer_id = c.customer_id WHERE YEAR(o.order_date) = 2024 GROUP BY c.country ORDER BY revenue DESC LIMIT 1"]}]
            - id: "b0000000000000000000000000000017"
              question: ["What was 2025 revenue by order priority?"]
              answer: [{format: SQL, content: ["SELECT order_priority, SUM(order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2025 GROUP BY order_priority ORDER BY order_priority"]}]
            - id: "b0000000000000000000000000000018"
              question: ["Split 2025 revenue by order priority."]
              answer: [{format: SQL, content: ["SELECT order_priority, SUM(order_amount) AS revenue FROM ${var.catalog}.${var.schema}.orders WHERE YEAR(order_date) = 2025 GROUP BY order_priority ORDER BY order_priority"]}]
            - id: "b0000000000000000000000000000019"
              question: ["How many customers are in each market segment?"]
              answer: [{format: SQL, content: ["SELECT market_segment, COUNT(*) AS customers FROM ${var.catalog}.${var.schema}.customers GROUP BY market_segment ORDER BY customers DESC"]}]
            - id: "b0000000000000000000000000000020"
              question: ["Customer count per market segment?"]
              answer: [{format: SQL, content: ["SELECT market_segment, COUNT(*) AS customers FROM ${var.catalog}.${var.schema}.customers GROUP BY market_segment ORDER BY customers DESC"]}]
