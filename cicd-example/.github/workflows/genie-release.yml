# Merge to main: deploy to staging, run the benchmarks, and promote to prod only when they pass.
# If accuracy is not above the threshold, the gate prints the failing questions and reasons, Databricks
# emails the team (GENIE_ALERT_EMAIL), the staging job fails and the prod job never starts.
name: Genie Agent release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: genie-release
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy to staging and run benchmarks
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
      BUNDLE_VAR_alert_email: ${{ secrets.GENIE_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databricks-sdk
      - name: Seed example data (example only)
        run: python scripts/seed_demo_data.py --catalog staging --warehouse-id "$BUNDLE_VAR_warehouse_id"
      - name: Deploy the agent and its benchmarks to staging
        run: databricks bundle deploy -t staging
      - name: Benchmark gate (accuracy must be above the threshold)
        run: scripts/run_gate.sh staging

  prod:
    name: Promote to prod
    needs: staging # runs only when the staging benchmark gate passed
    runs-on: ubuntu-latest
    environment: prod # add required reviewers on this environment for a manual approval step
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
      BUNDLE_VAR_alert_email: ${{ secrets.GENIE_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databricks-sdk
      - name: Seed example data (example only)
        run: python scripts/seed_demo_data.py --catalog prod --warehouse-id "$BUNDLE_VAR_warehouse_id"
      - name: Deploy the agent and its benchmarks to prod
        run: databricks bundle deploy -t prod
      - name: Post-deployment benchmark check in prod
        run: scripts/run_gate.sh prod
